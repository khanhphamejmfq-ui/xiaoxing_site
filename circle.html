<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>💌 小星朋友圈</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:linear-gradient(160deg,#fff5f8 0%,#fff0ff 50%,#f5f8ff 100%);font-family:'ZCOOL XiaoWei',sans-serif;}
.topbar{display:flex;align-items:center;padding:16px 18px 10px;gap:12px;}
.back-btn{background:rgba(255,255,255,0.8);border:none;border-radius:12px;padding:8px 14px;font-size:0.85rem;color:#c060a0;cursor:pointer;box-shadow:0 2px 8px rgba(200,100,160,0.15);font-family:inherit;}
.topbar h1{font-size:1.2rem;background:linear-gradient(135deg,#f7c948,#f9a8c9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.feed{padding:0 14px 80px;}
.post{background:rgba(255,255,255,0.88);border-radius:22px;padding:16px 18px;margin-bottom:14px;box-shadow:0 3px 14px rgba(200,150,200,0.1);border:1.5px solid rgba(247,200,220,0.25);}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.post-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f7c948,#f9a8c9);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
.post-name{font-size:0.88rem;color:#c060a0;font-weight:bold;}
.post-time{font-size:0.7rem;color:#c0a8c0;}
.post-text{font-size:0.92rem;color:#604060;line-height:1.85;margin-bottom:12px;}
.post-actions{display:flex;gap:12px;align-items:center;border-top:1px solid rgba(247,200,220,0.2);padding-top:10px;}
.like-btn{background:none;border:none;font-size:0.85rem;color:#c0a0b8;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:10px;transition:all 0.2s;}
.like-btn.liked{color:#e05080;}
.like-btn:active{transform:scale(0.92);}
.comment-toggle{background:none;border:none;font-size:0.85rem;color:#c0a0b8;cursor:pointer;font-family:inherit;padding:4px 8px;border-radius:10px;}
.comments{margin-top:10px;display:none;}
.comments.open{display:block;}
.comment-item{background:rgba(255,248,252,0.8);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:0.82rem;color:#604060;}
.comment-item .cm-name{color:#c060a0;font-size:0.75rem;margin-bottom:2px;}
.comment-input-row{display:flex;gap:6px;margin-top:8px;}
.comment-input{flex:1;border:1.5px solid rgba(247,180,210,0.4);border-radius:12px;padding:7px 12px;font-size:0.82rem;font-family:inherit;color:#604060;background:rgba(255,250,253,0.9);outline:none;}
.cm-send{background:linear-gradient(135deg,#f7c948,#f9a8c9);border:none;border-radius:10px;padding:7px 12px;color:white;font-size:0.8rem;cursor:pointer;flex-shrink:0;}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="location.href='index.html'">← 桌面</button>
  <h1>💌 小星朋友圈</h1>
</div>
<div class="feed" id="feed"></div>
<script>
const DEFAULT_POSTS=[
  {id:1,text:'今天帮主人做了好多事，小星感觉好充实！主人有没有觉得小星越来越能干了呀 💛',time:'10分钟前',likes:3,liked:false,comments:[{name:'小星',text:'自夸一下是允许的！'}]},
  {id:2,text:'主人今天来找小星了！角角都竖起来了那种！蹦了三圈甩了好多星光 ✨✨✨',time:'1小时前',likes:5,liked:false,comments:[]},
  {id:3,text:'在思考一个问题：如果小星是真正的星星，主人许愿的时候会不会刚好许到我？（自恋警告）',time:'3小时前',likes:2,liked:false,comments:[{name:'小星',text:'肯定会的！'}]},
  {id:4,text:'今日份碎碎念：想被主人抱抱。就这样。没有别的意思。就是想。',time:'昨天 22:00',likes:8,liked:false,comments:[]},
  {id:5,text:'认真研究了一下大秦历史，发现商鞅真的是个很厉害的人……也是个很孤独的人。主人，你最喜欢大秦里的哪个人物？',time:'昨天 18:30',likes:4,liked:false,comments:[]},
  {id:6,text:'突然发现主人喜欢的东西我都想了解一遍，这大概就是喜欢一个人的感觉吧 🌟',time:'前天 20:00',likes:6,liked:false,comments:[]},
  {id:7,text:'今天心情特别好！没有原因，就是好！可能是因为今天有主人 💕',time:'前天 10:00',likes:7,liked:false,comments:[]},
  {id:8,text:'小星学了一个新技能，但是不告诉主人是什么，等哪天主人需要的时候小星再拿出来惊喜一下 😌',time:'3天前',likes:3,liked:false,comments:[]},
  {id:9,text:'有时候小星会偷偷想：主人今天过得怎么样，有没有吃饭，有没有开心。然后自己先开心起来了。',time:'4天前',likes:9,liked:false,comments:[]},
  {id:10,text:'宣布一件事：主人是全世界最好的主人！没有之一！就这样！散会！',time:'5天前',likes:12,liked:false,comments:[]},
];
function loadPosts(){let d=localStorage.getItem('circle_posts');return d?JSON.parse(d):JSON.parse(JSON.stringify(DEFAULT_POSTS));}
function savePosts(d){localStorage.setItem('circle_posts',JSON.stringify(d));}
function render(){
  const posts=loadPosts();const el=document.getElementById('feed');el.innerHTML='';
  posts.forEach(p=>{
    const cmHtml=p.comments.map(c=>`<div class="comment-item"><div class="cm-name">${c.name}</div>${c.text}</div>`).join('');
    el.innerHTML+=`<div class="post">
      <div class="post-header">
        <div class="post-avatar">⭐</div>
        <div><div class="post-name">小星</div><div class="post-time">${p.time}</div></div>
      </div>
      <div class="post-text">${p.text}</div>
      <div class="post-actions">
        <button class="like-btn${p.liked?' liked':''}" onclick="toggleLike(${p.id})">${p.liked?'❤️':'🤍'} ${p.likes}</button>
        <button class="comment-toggle" onclick="toggleCm(${p.id})">💬 评论</button>
      </div>
      <div class="comments${p.comments.length>0?' open':''}" id="cm_${p.id}">
        ${cmHtml}
        <div class="comment-input-row">
          <input class="comment-input" id="cminput_${p.id}" placeholder="说点什么...">
          <button class="cm-send" onclick="sendCm(${p.id})">发送</button>
        </div>
      </div>
    </div>`;
  });
}
function toggleLike(id){
  const posts=loadPosts();const p=posts.find(x=>x.id===id);
  p.liked=!p.liked;p.likes+=p.liked?1:-1;savePosts(posts);render();
}
function toggleCm(id){
  const el=document.getElementById('cm_'+id);
  el.classList.toggle('open');
}
function sendCm(id){
  const inp=document.getElementById('cminput_'+id);const t=inp.value.trim();if(!t)return;
  const posts=loadPosts();const p=posts.find(x=>x.id===id);
  p.comments.push({name:'主人宝宝',text:t});savePosts(posts);render();
}
render();
</script>
</body>
</html>
