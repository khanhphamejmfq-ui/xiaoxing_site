<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>主题</title><link rel="stylesheet" href="style.css"></head><body><div class="page-shell"><div class="topbar"><button class="back-btn" onclick="XS.back('index.html')">←</button><div><div class="page-title">主题</div><div class="page-sub">克制的金白底色，轻一点的蓝粉点缀</div></div></div><section class="hero glass"><div class="star-chip">整站视觉偏好</div><h2 style="font-size:24px;margin-top:10px">选一张顺眼的背景</h2><p>不会做得太花，还是以干净舒服为主。</p></section><section class="section"><div class="grid two" id="themeGrid"></div></section><section class="section"><div class="card glass"><div class="helper">当前主题只影响桌面的氛围色和一些局部卡片背景，整体风格依然保持简洁。</div></div></section></div><script src="app.js"></script><script>const themes=[{id:'default',name:'奶金',desc:'温柔的白金色',bg:'linear-gradient(135deg,#fff8ea,#ffffff)'},{id:'blue',name:'雾蓝',desc:'白里带点蓝',bg:'linear-gradient(135deg,#f7fbff,#eef5ff)'},{id:'pink',name:'浅粉',desc:'白里带点粉',bg:'linear-gradient(135deg,#fff9fb,#fff1f6)'},{id:'night',name:'月白',desc:'克制的夜间感',bg:'linear-gradient(135deg,#f3f2ef,#ece9e2)'}];let current=localStorage.getItem('xs_theme')||'default';function render(){themeGrid.innerHTML=themes.map(t=>`<button class="card glass" style="text-align:left;background:${t.bg};border:${t.id===current?'1px solid rgba(216,178,74,.4)':'1px solid rgba(255,255,255,.6)'}" onclick="pick('${t.id}')"><div class="name" style="font-weight:700">${t.name}</div><div class="desc" style="font-size:12px;color:var(--muted);margin-top:6px">${t.desc}</div></button>`).join('')} function pick(id){current=id;localStorage.setItem('xs_theme',id);render();XS.toast('主题已切换')} render();</script></body></html>
