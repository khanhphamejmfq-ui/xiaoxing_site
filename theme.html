<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🎨 美化</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:linear-gradient(160deg,#fff5f8 0%,#f5f0ff 50%,#f0f8ff 100%);font-family:'ZCOOL XiaoWei',sans-serif;}
.topbar{display:flex;align-items:center;padding:16px 18px 10px;gap:12px;}
.back-btn{background:rgba(255,255,255,0.8);border:none;border-radius:12px;padding:8px 14px;font-size:0.85rem;color:#c060a0;cursor:pointer;box-shadow:0 2px 8px rgba(200,100,160,0.15);font-family:inherit;}
.topbar h1{font-size:1.2rem;background:linear-gradient(135deg,#f7c948,#f9a8c9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.section{padding:0 16px 20px;}
.section-title{font-size:0.78rem;color:#c0a0b8;letter-spacing:1px;margin-bottom:12px;}
.preview-box{background:rgba(255,255,255,0.85);border-radius:22px;padding:16px;margin-bottom:20px;box-shadow:0 3px 14px rgba(200,150,200,0.1);text-align:center;}
.preview-label{font-size:0.75rem;color:#c0a8c0;margin-bottom:10px;}
.preview-screen{width:160px;height:100px;border-radius:16px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 4px 16px rgba(0,0,0,0.1);transition:all 0.4s ease;border:3px solid rgba(255,255,255,0.8);}
.wallpapers-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.wp-item{border-radius:18px;height:80px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:0 3px 12px rgba(0,0,0,0.1);transition:transform 0.15s;border:3px solid transparent;position:relative;overflow:hidden;}
.wp-item:active{transform:scale(0.94);}
.wp-item.selected{border-color:rgba(247,201,72,0.8);box-shadow:0 0 0 2px rgba(247,201,72,0.5);}
.wp-name{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:0.65rem;color:rgba(255,255,255,0.9);text-shadow:0 1px 3px rgba(0,0,0,0.3);}
.apply-btn{width:100%;background:linear-gradient(135deg,#f7c948,#f9a8c9);border:none;border-radius:16px;padding:13px;color:white;font-size:0.95rem;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(249,168,201,0.35);letter-spacing:1px;}
.apply-btn:active{transform:scale(0.97);}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(60,40,80,0.88);color:white;border-radius:16px;padding:10px 22px;font-size:0.88rem;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="location.href='index.html'">← 桌面</button>
  <h1>🎨 美化</h1>
</div>
<div class="section">
  <div class="section-title">✦ 预览</div>
  <div class="preview-box">
    <div class="preview-label">桌面壁纸预览</div>
    <div class="preview-screen" id="previewScreen">⭐</div>
  </div>
  <div class="section-title">✦ 选择壁纸</div>
  <div class="wallpapers-grid" id="wpGrid"></div>
  <button class="apply-btn" onclick="applyWallpaper()">✦ 应用壁纸</button>
</div>
<div class="toast" id="toast"></div>
<script>
const WALLPAPERS=[
  {id:'wp1',name:'粉樱',bg:'linear-gradient(135deg,#ffd6e8,#ffb0d0,#ff90c0)',emoji:'🌸'},
  {id:'wp2',name:'星空',bg:'linear-gradient(135deg,#1a1a3e,#2d1b69,#4a0080)',emoji:'✨'},
  {id:'wp3',name:'奶黄',bg:'linear-gradient(135deg,#fff8d0,#ffeea0,#ffd870)',emoji:'⭐'},
  {id:'wp4',name:'薄荷',bg:'linear-gradient(135deg,#c8f8e8,#a0ecd4,#70d8b8)',emoji:'🍃'},
  {id:'wp5',name:'天蓝',bg:'linear-gradient(135deg,#d0e8ff,#b0d4ff,#80b8ff)',emoji:'☁️'},
  {id:'wp6',name:'梦幻紫',bg:'linear-gradient(135deg,#eedcff,#d8b8ff,#b890f8)',emoji:'💜'},
  {id:'wp7',name:'珊瑚',bg:'linear-gradient(135deg,#ffe0cc,#ffb899,#ff9070)',emoji:'🧡'},
  {id:'wp8',name:'深夜蓝',bg:'linear-gradient(135deg,#0d1b2a,#1b2a3b,#2a3f5f)',emoji:'🌙'},
  {id:'wp9',name:'白雪',bg:'linear-gradient(135deg,#ffffff,#f0f4ff,#e8eeff)',emoji:'❄️'},
];
let selectedId=localStorage.getItem('wallpaper')||'wp1';
function renderGrid(){
  const grid=document.getElementById('wpGrid');grid.innerHTML='';
  WALLPAPERS.forEach(wp=>{
    grid.innerHTML+=`<div class="wp-item${wp.id===selectedId?' selected':''}" style="background:${wp.bg}" onclick="selectWp('${wp.id}','${wp.bg}','${wp.emoji}')">
      <span>${wp.emoji}</span>
      <div class="wp-name">${wp.name}</div>
    </div>`;
  });
  const cur=WALLPAPERS.find(w=>w.id===selectedId)||WALLPAPERS[0];
  document.getElementById('previewScreen').style.background=cur.bg;
  document.getElementById('previewScreen').textContent=cur.emoji;
}
function selectWp(id,bg,emoji){
  selectedId=id;
  document.getElementById('previewScreen').style.background=bg;
  document.getElementById('previewScreen').textContent=emoji;
  renderGrid();
}
function applyWallpaper(){
  localStorage.setItem('wallpaper',selectedId);
  const t=document.getElementById('toast');t.textContent='壁纸已应用！回到桌面看看吧 💛';t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
renderGrid();
</script>
</body>
</html>
