<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🎰 每日福利</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:linear-gradient(160deg,#fff8e0 0%,#fff0f8 50%,#f8f0ff 100%);font-family:'ZCOOL XiaoWei',sans-serif;display:flex;flex-direction:column;align-items:center;}
.topbar{width:100%;display:flex;align-items:center;padding:16px 18px 10px;gap:12px;}
.back-btn{background:rgba(255,255,255,0.8);border:none;border-radius:12px;padding:8px 14px;font-size:0.85rem;color:#c060a0;cursor:pointer;box-shadow:0 2px 8px rgba(200,100,160,0.15);font-family:inherit;}
.topbar h1{font-size:1.2rem;background:linear-gradient(135deg,#f7c948,#f9a8c9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.balance-bar{background:rgba(255,255,255,0.85);border-radius:18px;padding:10px 20px;margin:4px 16px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 12px rgba(200,150,200,0.1);width:calc(100% - 32px);max-width:398px;}
.balance-label{font-size:0.82rem;color:#c0a0b8;}
.balance-val{font-size:1.1rem;color:#f7a040;font-weight:bold;margin-left:auto;}
.wheel-wrap{position:relative;width:280px;height:280px;margin:10px auto;}
canvas{border-radius:50%;box-shadow:0 8px 32px rgba(200,150,200,0.25);}
.pointer{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:2rem;z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.2));}
.spin-btn{margin:18px auto 0;background:linear-gradient(135deg,#f7c948,#f9a8c9);border:none;border-radius:20px;padding:14px 48px;color:white;font-size:1.05rem;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(249,168,201,0.4);letter-spacing:2px;transition:transform 0.1s;}
.spin-btn:active{transform:scale(0.95);}
.spin-btn:disabled{opacity:0.5;cursor:not-allowed;}
.result-box{margin:16px 16px 0;background:rgba(255,255,255,0.88);border-radius:22px;padding:18px;text-align:center;box-shadow:0 3px 14px rgba(200,150,200,0.1);width:calc(100% - 32px);max-width:398px;display:none;}
.result-box.show{display:block;}
.result-coin{font-size:2rem;margin-bottom:6px;}
.result-title{font-size:1.1rem;color:#f7a040;margin-bottom:6px;}
.result-comment{font-size:0.88rem;color:#a07090;line-height:1.7;}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="location.href='index.html'">← 桌面</button>
  <h1>🎰 每日福利</h1>
</div>
<div class="balance-bar">
  <span class="balance-label">💰 星星币余额</span>
  <span class="balance-val" id="balanceVal">0</span>
</div>
<div class="wheel-wrap">
  <div class="pointer">▼</div>
  <canvas id="wheel" width="280" height="280"></canvas>
</div>
<button class="spin-btn" id="spinBtn" onclick="spin()">✦ 今日抽奖</button>
<div class="result-box" id="resultBox">
  <div class="result-coin" id="resultCoin"></div>
  <div class="result-title" id="resultTitle"></div>
  <div class="result-comment" id="resultComment"></div>
</div>
<script>
const PRIZES=[
  {label:'1币',value:1,color:'#ffe0e8',comment:'就1个啊……小星也没办法，手气嘛 😑'},
  {label:'5币',value:5,color:'#ffeec0',comment:'5个！小星觉得还不错啦！'},
  {label:'10币',value:10,color:'#d8f0ff',comment:'10个！主人人品不错嘛～'},
  {label:'50币',value:50,color:'#d8ffe8',comment:'哇50个！主人今天运气超好！'},
  {label:'100币',value:100,color:'#eedcff',comment:'100个！！主人是锦鲤本鲤！！'},
  {label:'888币',value:888,color:'#fff0a0',comment:'8 8 8 ！！！！小星震惊了！！主人你是神？？？'},
  {label:'1币',value:1,color:'#ffe0e8',comment:'又是1个……小星摸摸主人的头 💛'},
  {label:'10币',value:10,color:'#d8f0ff',comment:'10个！稳稳当当！'},
];
const TOTAL=PRIZES.length;
const arc=2*Math.PI/TOTAL;
function getBalance(){return parseInt(localStorage.getItem('starCoins')||'0');}
function addBalance(v){localStorage.setItem('starCoins',String(getBalance()+v));}
function getTodayKey(){const n=new Date();return 'lucky_'+n.getFullYear()+'_'+n.getMonth()+'_'+n.getDate();}

// 指针在顶部（-Math.PI/2），转盘从angle=0开始绘制
// 当转盘旋转angle后，顶部对应的扇区索引：idx = floor((-angle + PI/2) / arc) % TOTAL
function getIdxAtPointer(angle){
  const norm = ((-angle % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  return Math.floor(norm/arc) % TOTAL;
}

function drawWheel(angle){
  const canvas=document.getElementById('wheel');
  const ctx=canvas.getContext('2d');
  const cx=140,cy=140,r=130;
  ctx.clearRect(0,0,280,280);
  PRIZES.forEach((p,i)=>{
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,angle+arc*i,angle+arc*(i+1));
    ctx.closePath();
    ctx.fillStyle=p.color;
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.6)';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(angle+arc*i+arc/2);
    ctx.textAlign='right';
    ctx.fillStyle='#604060';
    ctx.font='bold 15px ZCOOL XiaoWei,sans-serif';
    ctx.fillText(p.label,r-12,5);
    ctx.restore();
  });
  ctx.beginPath();ctx.arc(cx,cy,22,0,2*Math.PI);
  ctx.fillStyle='white';ctx.fill();
  ctx.strokeStyle='rgba(247,180,210,0.5)';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#f7a8c9';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('✦',cx,cy);
}

let currentAngle=0;
drawWheel(currentAngle);
document.getElementById('balanceVal').textContent=getBalance();
if(localStorage.getItem(getTodayKey())){
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('spinBtn').textContent='明天再来 ✦';
}

function spin(){
  if(localStorage.getItem(getTodayKey()))return;
  const btn=document.getElementById('spinBtn');btn.disabled=true;
  const idx=Math.floor(Math.random()*TOTAL);
  const prize=PRIZES[idx];
  // 让idx扇区中心对准顶部指针
  // 扇区idx中心角度（在转盘坐标系中）= arc*idx + arc/2
  // 要让它转到顶部(-PI/2)，需要的最终angle满足：angle + arc*idx + arc/2 = -PI/2 + 2k*PI
  // 即 targetAngle = -PI/2 - arc*idx - arc/2
  const spins=5+Math.floor(Math.random()*3);
  const baseTarget=-Math.PI/2-arc*idx-arc/2;
  // 从currentAngle出发，加够整圈
  const diff=((baseTarget-currentAngle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  const targetAngle=currentAngle+spins*2*Math.PI+diff;
  const duration=4000;
  const startAngle=currentAngle;
  const startTime=performance.now();
  function animate(now){
    const elapsed=now-startTime;
    const t=Math.min(elapsed/duration,1);
    const ease=1-Math.pow(1-t,4);
    currentAngle=startAngle+(targetAngle-startAngle)*ease;
    drawWheel(currentAngle);
    if(t<1){requestAnimationFrame(animate);}
    else{
      currentAngle=targetAngle;
      drawWheel(currentAngle);
      // 验证实际对准的扇区
      const actualIdx=getIdxAtPointer(currentAngle);
      const actualPrize=PRIZES[actualIdx];
      addBalance(actualPrize.value);
      localStorage.setItem(getTodayKey(),'1');
      document.getElementById('balanceVal').textContent=getBalance();
      document.getElementById('resultCoin').textContent='💰 +'+actualPrize.value+' 星星币';
      document.getElementById('resultTitle').textContent='恭喜获得 '+actualPrize.label+'！';
      document.getElementById('resultComment').textContent=actualPrize.comment;
      document.getElementById('resultBox').classList.add('show');
      btn.textContent='明天再来 ✦';
    }
  }
  requestAnimationFrame(animate);
}
</script>
</body>
</html>
