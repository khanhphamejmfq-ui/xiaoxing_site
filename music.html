<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🎵 音乐</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:linear-gradient(160deg,#f5f0ff 0%,#fff0f8 50%,#fff8f0 100%);font-family:'ZCOOL XiaoWei',sans-serif;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;padding:16px 18px 10px;gap:12px;}
.back-btn{background:rgba(255,255,255,0.8);border:none;border-radius:12px;padding:8px 14px;font-size:0.85rem;color:#c060a0;cursor:pointer;box-shadow:0 2px 8px rgba(200,100,160,0.15);font-family:inherit;}
.topbar h1{font-size:1.2rem;background:linear-gradient(135deg,#f7c948,#f9a8c9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.player-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 24px 40px;}
.cover{width:200px;height:200px;border-radius:50%;background:linear-gradient(135deg,#e8d4ff,#ffd4e8,#d4e8ff);display:flex;align-items:center;justify-content:center;font-size:5rem;box-shadow:0 8px 32px rgba(180,140,220,0.3);margin-bottom:28px;transition:transform 0.3s;}
.cover.playing{animation:spin 8s linear infinite;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.song-title{font-size:1.2rem;color:#604060;margin-bottom:4px;letter-spacing:1px;text-align:center;}
.song-artist{font-size:0.85rem;color:#c0a0c0;margin-bottom:24px;text-align:center;}
.progress-wrap{width:100%;max-width:320px;margin-bottom:20px;}
.progress-bar{width:100%;height:6px;background:rgba(200,160,220,0.2);border-radius:4px;overflow:hidden;cursor:pointer;}
.progress-fill{height:100%;background:linear-gradient(90deg,#d0a0f8,#f9a8c9);border-radius:4px;width:0%;transition:width 0.5s linear;}
.time-row{display:flex;justify-content:space-between;margin-top:6px;font-size:0.72rem;color:#c0a8c0;}
.controls{display:flex;align-items:center;gap:20px;margin-bottom:28px;}
.ctrl-btn{background:rgba(255,255,255,0.8);border:none;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer;box-shadow:0 3px 12px rgba(200,150,200,0.15);transition:transform 0.12s;}
.ctrl-btn:active{transform:scale(0.9);}
.play-btn{width:64px;height:64px;font-size:1.8rem;background:linear-gradient(135deg,#d0a0f8,#f9a8c9);box-shadow:0 4px 18px rgba(209,168,248,0.4);}
.playlist{width:100%;max-width:360px;background:rgba(255,255,255,0.8);border-radius:22px;padding:14px;box-shadow:0 3px 14px rgba(200,150,200,0.1);}
.playlist-title{font-size:0.78rem;color:#c0a0b8;letter-spacing:1px;margin-bottom:10px;padding-left:4px;}
.pl-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;cursor:pointer;transition:background 0.15s;}
.pl-item:hover,.pl-item.active{background:rgba(209,168,248,0.15);}
.pl-num{font-size:0.75rem;color:#c0a8c0;width:18px;text-align:center;flex-shrink:0;}
.pl-info{flex:1;}
.pl-name{font-size:0.88rem;color:#604060;}
.pl-artist{font-size:0.72rem;color:#c0a8c0;}
.pl-dur{font-size:0.72rem;color:#c0a8c0;flex-shrink:0;}
.note-tip{font-size:0.75rem;color:#c0b0d0;text-align:center;margin-top:10px;font-style:italic;}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="location.href='index.html?page=1'">← 桌面</button>
  <h1>🎵 音乐</h1>
</div>
<div class="player-wrap">
  <div class="cover" id="cover">🎵</div>
  <div class="song-title" id="songTitle">等待音乐</div>
  <div class="song-artist" id="songArtist">点击播放列表选择歌曲</div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="time-row"><span id="curTime">0:00</span><span id="totalTime">0:00</span></div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" onclick="prev()">⏮</button>
    <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()">▶</button>
    <button class="ctrl-btn" onclick="next()">⏭</button>
  </div>
  <div class="playlist">
    <div class="playlist-title">✦ 播放列表（音源待添加）</div>
    <div id="playlist"></div>
    <div class="note-tip">音乐功能框架已就绪，主人添加音源后即可使用 💛</div>
  </div>
</div>
<script>
const SONGS=[
  {title:'星星点灯',artist:'郑智化',duration:'4:32',emoji:'⭐'},
  {title:'小幸运',artist:'田馥甄',duration:'4:10',emoji:'🌸'},
  {title:'年少有为',artist:'李荣浩',duration:'4:05',emoji:'🌟'},
  {title:'起风了',artist:'买辣椒也用券',duration:'5:11',emoji:'🍃'},
  {title:'晴天',artist:'周杰伦',duration:'4:29',emoji:'☀️'},
  {title:'光年之外',artist:'G.E.M.',duration:'4:08',emoji:'✨'},
];
let curIdx=0,playing=false,progress=0,timer=null;
function renderPlaylist(){
  const el=document.getElementById('playlist');el.innerHTML='';
  SONGS.forEach((s,i)=>{
    el.innerHTML+=`<div class="pl-item${i===curIdx?' active':''}" onclick="selectSong(${i})">
      <span class="pl-num">${i+1}</span>
      <div class="pl-info"><div class="pl-name">${s.emoji} ${s.title}</div><div class="pl-artist">${s.artist}</div></div>
      <span class="pl-dur">${s.duration}</span>
    </div>`;
  });
}
function updateDisplay(){
  const s=SONGS[curIdx];
  document.getElementById('cover').textContent=s.emoji;
  document.getElementById('songTitle').textContent=s.title;
  document.getElementById('songArtist').textContent=s.artist;
  document.getElementById('totalTime').textContent=s.duration;
  document.getElementById('playBtn').textContent=playing?'⏸':'▶';
  document.getElementById('cover').className='cover'+(playing?' playing':'');
  renderPlaylist();
}
function togglePlay(){
  playing=!playing;
  if(playing){
    timer=setInterval(()=>{
      progress+=0.5;
      if(progress>=100){progress=0;next();return;}
      document.getElementById('progressFill').style.width=progress+'%';
    },200);
  } else {
    clearInterval(timer);
  }
  updateDisplay();
}
function selectSong(i){clearInterval(timer);curIdx=i;playing=false;progress=0;document.getElementById('progressFill').style.width='0%';updateDisplay();}
function prev(){selectSong((curIdx-1+SONGS.length)%SONGS.length);}
function next(){selectSong((curIdx+1)%SONGS.length);}
updateDisplay();
</script>
</body>
</html>
