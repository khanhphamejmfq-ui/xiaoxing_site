<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>工具箱</title><link rel="stylesheet" href="style.css"></head><body><div class="page-shell"><div class="topbar"><button class="back-btn" onclick="XS.back('index.html')">←</button><div><div class="page-title">工具箱</div><div class="page-sub">先放便签和几个顺手小工具</div></div></div><section class="section"><div class="card glass"><div class="section-head" style="padding:0;margin-bottom:10px"><h3>快捷便签</h3></div><div class="row-actions"><input class="input" id="noteInput" placeholder="记一条短便签"><button class="primary-btn" id="addBtn">添加</button></div></div></section><section class="section"><div class="mini-list" id="notesList"></div></section><section class="section"><div class="grid two"><div class="card glass"><div class="page-sub">当前时间</div><div style="font-size:28px;font-weight:700;margin-top:8px" id="clockBox"></div></div><div class="card glass"><div class="page-sub">随机鼓励</div><div style="line-height:1.7;margin-top:8px" id="moodBox">慢慢来，小星陪你。</div></div></div></section></div><script src="app.js"></script><script>const KEY='xs_notes';const moods=['慢慢来，小星陪你。','已经很好啦，不用急。','先做一点点，也算前进。','今天也值得被温柔对待。'];function load(){return XS.load(KEY,[])}function save(v){XS.save(KEY,v)}function render(){const notes=load();notesList.innerHTML=notes.length?notes.map((n,i)=>`<div class="list-row glass"><div class="icon">⌂</div><div class="meta"><div class="name">便签 ${i+1}</div><div class="sub">${XS.escapeHtml(n.text)}</div></div><button class="small-btn" onclick="delNote(${i})">删除</button></div>`).join(''):'<div class="empty glass card">还没有便签。</div>'}function delNote(i){const d=load();d.splice(i,1);save(d);render()}window.delNote=delNote;addBtn.onclick=()=>{const t=noteInput.value.trim();if(!t)return;const d=load();d.unshift({text:t});save(d);noteInput.value='';render();XS.toast('已添加便签')};function tick(){const d=new Date();clockBox.textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}tick();setInterval(tick,1000);moodBox.textContent=moods[Math.floor(Math.random()*moods.length)];render();</script></body></html>
