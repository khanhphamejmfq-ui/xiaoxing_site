<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🧮 工具箱</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:linear-gradient(160deg,#f5f8ff 0%,#fff0f8 50%,#fff8f0 100%);font-family:'ZCOOL XiaoWei',sans-serif;}
.topbar{display:flex;align-items:center;padding:16px 18px 10px;gap:12px;}
.back-btn{background:rgba(255,255,255,0.8);border:none;border-radius:12px;padding:8px 14px;font-size:0.85rem;color:#c060a0;cursor:pointer;box-shadow:0 2px 8px rgba(200,100,160,0.15);font-family:inherit;}
.topbar h1{font-size:1.2rem;background:linear-gradient(135deg,#f7c948,#f9a8c9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.section-title{font-size:0.8rem;color:#c0a0b8;letter-spacing:1px;padding:0 18px 8px;}
.add-box{margin:0 16px 16px;background:rgba(255,255,255,0.88);border-radius:22px;padding:14px 16px;box-shadow:0 3px 14px rgba(200,150,200,0.1);display:flex;gap:8px;}
.note-input{flex:1;border:1.5px solid rgba(247,180,210,0.4);border-radius:14px;padding:9px 14px;font-size:0.88rem;font-family:inherit;color:#604060;background:rgba(255,250,253,0.9);outline:none;}
.add-btn{background:linear-gradient(135deg,#f7c948,#f9a8c9);border:none;border-radius:14px;padding:9px 16px;color:white;font-size:0.9rem;cursor:pointer;flex-shrink:0;}
.notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 30px;}
.note-card{background:rgba(255,255,255,0.88);border-radius:18px;padding:14px;box-shadow:0 3px 12px rgba(200,150,200,0.1);border:1.5px solid rgba(247,200,220,0.25);position:relative;min-height:80px;}
.note-text{font-size:0.88rem;color:#604060;line-height:1.7;word-break:break-all;padding-bottom:24px;}
.note-del{position:absolute;bottom:8px;right:10px;background:rgba(255,220,220,0.7);border:none;border-radius:8px;padding:3px 8px;font-size:0.7rem;color:#e06060;cursor:pointer;font-family:inherit;}
.note-time{position:absolute;bottom:8px;left:10px;font-size:0.65rem;color:#c0b0c0;}
.empty{text-align:center;color:#d0a0c0;padding:40px;font-size:0.88rem;grid-column:1/-1;}
.divider{height:1px;background:rgba(247,200,220,0.3);margin:0 16px 14px;}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="location.href='index.html?page=1'">← 桌面</button>
  <h1>🧮 工具箱</h1>
</div>
<div class="section-title">📝 快捷便签</div>
<div class="add-box">
  <input class="note-input" id="noteInput" placeholder="随手记点什么...">
  <button class="add-btn" onclick="addNote()">+</button>
</div>
<div class="notes-grid" id="notesGrid"></div>
<script>
const COLORS=['rgba(255,248,220,0.9)','rgba(255,235,245,0.9)','rgba(235,245,255,0.9)','rgba(240,255,240,0.9)','rgba(250,235,255,0.9)'];
function load(){let d=localStorage.getItem('notes');return d?JSON.parse(d):[];}
function save(d){localStorage.setItem('notes',JSON.stringify(d));}
function render(){
  const notes=load();const el=document.getElementById('notesGrid');el.innerHTML='';
  if(notes.length===0){el.innerHTML='<div class="empty">便签是空的，随手记点什么吧 📝</div>';return;}
  [...notes].reverse().forEach((n,ri)=>{
    const i=notes.length-1-ri;
    const color=COLORS[i%COLORS.length];
    el.innerHTML+=`<div class="note-card" style="background:${color}">
      <div class="note-text">${n.text}</div>
      <div class="note-time">${n.time}</div>
      <button class="note-del" onclick="delNote(${notes.length-1-ri})">删除</button>
    </div>`;
  });
}
function addNote(){
  const t=document.getElementById('noteInput').value.trim();if(!t)return;
  const now=new Date();
  const time=(now.getMonth()+1)+'/'+now.getDate()+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const d=load();d.push({text:t,time});save(d);
  document.getElementById('noteInput').value='';render();
}
function delNote(i){const d=load();d.splice(i,1);save(d);render();}
document.getElementById('noteInput').addEventListener('keydown',e=>{if(e.key==='Enter')addNote();});
render();
</script>
</body>
</html>
