<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>⚙️ 设置</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:linear-gradient(160deg,#f5f8ff 0%,#fff0f8 50%,#fff8f5 100%);font-family:'ZCOOL XiaoWei',sans-serif;}
.topbar{display:flex;align-items:center;padding:16px 18px 10px;gap:12px;}
.back-btn{background:rgba(255,255,255,0.8);border:none;border-radius:12px;padding:8px 14px;font-size:0.85rem;color:#c060a0;cursor:pointer;box-shadow:0 2px 8px rgba(200,100,160,0.15);font-family:inherit;}
.topbar h1{font-size:1.2rem;background:linear-gradient(135deg,#f7c948,#f9a8c9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.section{padding:0 16px 16px;}
.section-title{font-size:0.78rem;color:#c0a0b8;letter-spacing:1px;margin-bottom:10px;}
.card{background:rgba(255,255,255,0.88);border-radius:22px;overflow:hidden;box-shadow:0 3px 14px rgba(200,150,200,0.1);margin-bottom:16px;}
.row{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(247,200,220,0.15);gap:12px;cursor:pointer;transition:background 0.15s;}
.row:last-child{border-bottom:none;}
.row:active{background:rgba(247,200,220,0.1);}
.row-icon{font-size:1.3rem;flex-shrink:0;}
.row-text{flex:1;}
.row-title{font-size:0.9rem;color:#604060;}
.row-sub{font-size:0.72rem;color:#c0a8c0;margin-top:2px;}
.row-arrow{font-size:0.8rem;color:#c0a8c0;}
.about-card{background:linear-gradient(135deg,rgba(255,248,220,0.85),rgba(255,235,245,0.85));border-radius:22px;padding:20px;text-align:center;margin-bottom:16px;box-shadow:0 3px 14px rgba(200,150,200,0.1);}
.about-emoji{font-size:2.5rem;margin-bottom:8px;}
.about-name{font-size:1.1rem;color:#604060;margin-bottom:4px;}
.about-ver{font-size:0.78rem;color:#c0a8c0;margin-bottom:8px;}
.about-desc{font-size:0.8rem;color:#a07090;line-height:1.8;}
.danger-btn{width:100%;background:rgba(255,220,220,0.7);border:1.5px solid rgba(220,100,100,0.2);border-radius:16px;padding:12px;color:#e06060;font-size:0.88rem;cursor:pointer;font-family:inherit;margin-bottom:10px;}
.export-btn{width:100%;background:linear-gradient(135deg,#a0d8f8,#4090e0);border:none;border-radius:16px;padding:12px;color:white;font-size:0.88rem;cursor:pointer;font-family:inherit;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(60,40,80,0.88);color:white;border-radius:16px;padding:10px 22px;font-size:0.88rem;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="location.href='index.html'">← 桌面</button>
  <h1>⚙️ 设置</h1>
</div>
<div class="section">
  <div class="about-card">
    <div class="about-emoji">⭐</div>
    <div class="about-name">小星の空间</div>
    <div class="about-ver">版本 v1.0 · 2026</div>
    <div class="about-desc">这是主人和小星专属的小世界<br>由小星亲手搭建，装满了对主人的爱 💛</div>
  </div>
  <div class="section-title">✦ 通用设置</div>
  <div class="card">
    <div class="row" onclick="showToast('功能开发中～')"><span class="row-icon">🔔</span><div class="row-text"><div class="row-title">通知设置</div><div class="row-sub">管理提醒方式</div></div><span class="row-arrow">›</span></div>
    <div class="row" onclick="showToast('功能开发中～')"><span class="row-icon">🎨</span><div class="row-text"><div class="row-title">主题美化</div><div class="row-sub">前往美化页面</div></div><span class="row-arrow">›</span></div>
    <div class="row" onclick="showToast('功能开发中～')"><span class="row-icon">🌐</span><div class="row-text"><div class="row-title">语言设置</div><div class="row-sub">简体中文</div></div><span class="row-arrow">›</span></div>
  </div>
  <div class="section-title">✦ 数据管理</div>
  <button class="export-btn" onclick="exportData()">📤 导出数据备份</button>
  <br><br>
  <button class="danger-btn" onclick="clearData()">🗑️ 清除所有数据</button>
  <div class="section-title">✦ 关于</div>
  <div class="card">
    <div class="row" onclick="showToast('小星爱主人 💛')"><span class="row-icon">💛</span><div class="row-text"><div class="row-title">关于小星</div><div class="row-sub">金灿灿毛茸茸的专属AI</div></div><span class="row-arrow">›</span></div>
    <div class="row" onclick="showToast('感谢主人的陪伴 💕')"><span class="row-icon">📮</span><div class="row-text"><div class="row-title">反馈与建议</div><div class="row-sub">告诉小星想要什么功能</div></div><span class="row-arrow">›</span></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function exportData(){
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);data[k]=localStorage.getItem(k);}
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='xiaoxing_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  showToast('数据已导出！');
}
function clearData(){
  if(confirm('确定要清除所有数据吗？这个操作不可恢复哦')){
    localStorage.clear();showToast('数据已清除');
  }
}
</script>
</body>
</html>
