<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>设置</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-shell">
  <div class="topbar">
    <button class="back-btn" onclick="XS.back('index.html')">←</button>
    <div><div class="page-title">设置</div><div class="page-sub">接口、偏好和备份都在这里</div></div>
  </div>

  <section class="hero glass">
    <div class="star-chip">接口优先 · 少按钮 · 更清晰</div>
    <h2 style="font-size:24px;margin-top:10px;">把 API 配清楚，剩下交给小星</h2>
    <p>这里会同时保存普通聊天和轻酒馆都能共用的 API 信息。</p>
  </section>

  <section class="section">
    <div class="section-head"><h3>API 配置</h3></div>
    <div class="card glass grid">
      <input class="input" id="apiUrl" placeholder="https://api.example.com/v1">
      <input class="input" id="apiKey" type="password" placeholder="sk-xxxx">
      <select class="select" id="modelSelect"><option value="">先拉取模型</option></select>
      <textarea class="textarea" id="sysPrompt" placeholder="可选：额外系统提示词，比如小星的人设补充"></textarea>
      <div class="row-actions">
        <button class="secondary-btn" id="fetchBtn">拉取模型列表</button>
        <button class="primary-btn" id="saveBtn">保存配置</button>
      </div>
      <div class="helper" id="status">先填地址和 Key，再拉模型。</div>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h3>通用</h3></div>
    <div class="mini-list">
      <div class="list-row glass"><div class="icon">◐</div><div class="meta"><div class="name">主题美化</div><div class="sub">去主题页调整壁纸和视觉偏好</div></div><button class="small-btn" onclick="XS.back('theme.html')">打开</button></div>
      <div class="list-row glass"><div class="icon">⌂</div><div class="meta"><div class="name">导出数据</div><div class="sub">把本地数据打包成 JSON 备份</div></div><button class="small-btn" id="exportBtn">导出</button></div>
      <div class="list-row glass"><div class="icon">⚠</div><div class="meta"><div class="name">清空本地数据</div><div class="sub">只清这个浏览器里保存的内容</div></div><button class="small-btn" id="clearBtn">清空</button></div>
    </div>
  </section>
</div>
<script src="app.js"></script>
<script>
const savedUrl=localStorage.getItem('api_url')||localStorage.getItem('xiaoxing_api_url')||'';
const savedKey=localStorage.getItem('api_key')||localStorage.getItem('xiaoxing_api_key')||'';
const savedModel=localStorage.getItem('api_model')||localStorage.getItem('xiaoxing_api_model')||'';
const savedPrompt=localStorage.getItem('xiaoxing_sys_prompt')||'';
apiUrl.value=savedUrl; apiKey.value=savedKey; sysPrompt.value=savedPrompt;
if(savedModel) modelSelect.innerHTML=`<option value="${savedModel}">${savedModel}</option>`;

async function fetchModels(){
  const url=apiUrl.value.trim().replace(/\/$/,'');
  const key=apiKey.value.trim();
  if(!url||!key){ status.textContent='先填地址和 Key。'; return; }
  status.textContent='正在拉取模型…';
  try{
    const res=await fetch(url+'/models',{headers:{Authorization:'Bearer '+key}});
    const data=await res.json();
    const models=data.data||data.models||[];
    modelSelect.innerHTML=models.map(m=>{ const id=typeof m==='string'?m:(m.id||m.name||''); return `<option value="${id}" ${id===savedModel?'selected':''}>${id}</option>`; }).join('') || '<option value="">没有模型</option>';
    status.textContent=`拿到 ${models.length||0} 个模型。`;
  }catch(e){ status.textContent='拉取失败：'+e.message; }
}
function saveConfig(){
  const url=apiUrl.value.trim().replace(/\/$/,'');
  const key=apiKey.value.trim();
  const model=modelSelect.value;
  localStorage.setItem('api_url',url); localStorage.setItem('api_key',key); localStorage.setItem('api_model',model);
  localStorage.setItem('xiaoxing_api_url',url+'/chat/completions'); localStorage.setItem('xiaoxing_api_key',key); localStorage.setItem('xiaoxing_api_model',model);
  localStorage.setItem('xiaoxing_sys_prompt',sysPrompt.value.trim());
  const tavernApi={url,key,model}; localStorage.setItem('xs_tavern_api', JSON.stringify(tavernApi));
  XS.toast('配置已保存'); status.textContent='已保存。';
}
function exportData(){
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);data[k]=localStorage.getItem(k);}
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='xiaoxing_backup.json'; a.click();
  XS.toast('已导出');
}
function clearData(){ if(confirm('确定清空这个浏览器里的本地数据吗？')){ localStorage.clear(); XS.toast('已清空'); setTimeout(()=>location.reload(),500);} }
fetchBtn.onclick=fetchModels; saveBtn.onclick=saveConfig; exportBtn.onclick=exportData; clearBtn.onclick=clearData;
</script>
</body>
</html>
