<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>日记本</title><link rel="stylesheet" href="style.css"></head><body><div class="page-shell"><div class="topbar"><button class="back-btn" onclick="XS.back('index.html')">←</button><div><div class="page-title">日记本</div><div class="page-sub">记一点心情，轻轻地放着</div></div></div><div class="mini-list" id="noteList"></div><div class="chat-input-bar"><textarea class="textarea" id="input" placeholder="写点什么……" style="min-height:56px"></textarea><button class="primary-btn" id="sendBtn">保存</button></div></div><script src="app.js"></script><script>const KEY='diary';function load(){return XS.load(KEY,[{who:'star',text:'主人今天也要被温柔对待。',time:'刚刚'}]);}function save(v){XS.save(KEY,v)}function render(){const data=load();noteList.innerHTML=data.map((n,i)=>`<div class="list-row glass"><div class="icon">${n.who==='star'?'✦':'◦'}</div><div class="meta"><div class="name">${n.who==='star'?'小星':'主人'}</div><div class="sub">${XS.escapeHtml(n.text)}<br><span class="helper">${n.time}</span></div></div></div>`).join('');}sendBtn.onclick=()=>{const t=input.value.trim();if(!t)return;const data=load();data.push({who:'user',text:t,time:new Date().toLocaleString('zh-CN',{hour12:false})});save(data);input.value='';render();setTimeout(()=>{const d=load();d.push({who:'star',text:'记下来了。小星会替主人把这点心情轻轻放好。',time:new Date().toLocaleString('zh-CN',{hour12:false})});save(d);render();},400)};input.addEventListener('input',e=>XS.autosize(e.target));input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendBtn.click();}});render();</script></body></html>
