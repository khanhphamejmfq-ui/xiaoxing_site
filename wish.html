<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>✨ 许愿池</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:linear-gradient(160deg,#fff8e0 0%,#fff0f8 50%,#f0f0ff 100%);font-family:'ZCOOL XiaoWei',sans-serif;overflow-x:hidden;}
.topbar{display:flex;align-items:center;padding:16px 18px 10px;gap:12px;}
.back-btn{background:rgba(255,255,255,0.8);border:none;border-radius:12px;padding:8px 14px;font-size:0.85rem;color:#c060a0;cursor:pointer;box-shadow:0 2px 8px rgba(200,100,160,0.15);font-family:inherit;}
.topbar h1{font-size:1.2rem;background:linear-gradient(135deg,#f7c948,#f9a8c9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.tabs{display:flex;gap:10px;padding:0 16px 12px;}
.tab{flex:1;padding:8px;text-align:center;border-radius:14px;font-size:0.88rem;cursor:pointer;border:none;font-family:inherit;background:rgba(255,255,255,0.6);color:#c0a0b8;transition:all 0.2s;}
.tab.active{background:linear-gradient(135deg,#f7c948,#f9a8c9);color:white;box-shadow:0 3px 10px rgba(249,168,201,0.3);}
.section{display:none;padding:0 16px 100px;}
.section.active{display:block;}
.wish-input-box{background:rgba(255,255,255,0.85);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 3px 12px rgba(200,150,200,0.1);}
.wish-input-box textarea{width:100%;border:1.5px solid rgba(247,180,210,0.4);border-radius:14px;padding:10px 14px;font-size:0.9rem;font-family:inherit;color:#604060;background:rgba(255,250,253,0.9);resize:none;outline:none;height:70px;}
.add-btn{width:100%;margin-top:10px;background:linear-gradient(135deg,#f7c948,#f9a8c9);border:none;border-radius:14px;padding:10px;color:white;font-size:0.9rem;cursor:pointer;font-family:inherit;}
.wish-card{background:rgba(255,255,255,0.85);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 3px 12px rgba(200,150,200,0.1);border:1.5px solid rgba(247,200,220,0.3);position:relative;}
.wish-card.done{opacity:0.65;border-color:rgba(180,220,180,0.4);background:rgba(240,255,240,0.7);}
.wish-text{font-size:0.92rem;color:#604060;line-height:1.7;margin-bottom:8px;}
.wish-text.done-text{text-decoration:line-through;color:#a0c0a0;}
.wish-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.wish-time{font-size:0.7rem;color:#c0a0b8;}
.done-btn{background:rgba(255,230,240,0.8);border:1.5px solid rgba(247,180,210,0.4);border-radius:10px;padding:4px 10px;font-size:0.75rem;color:#c060a0;cursor:pointer;font-family:inherit;}
.done-btn.is-done{background:rgba(220,255,220,0.8);border-color:rgba(100,200,100,0.4);color:#60a060;}
.del-btn{background:rgba(255,220,220,0.7);border:none;border-radius:10px;padding:4px 10px;font-size:0.75rem;color:#e06060;cursor:pointer;font-family:inherit;margin-left:auto;}
.encourage{font-size:0.78rem;color:#d080b0;font-style:italic;margin-top:6px;}
.bottle-area{text-align:center;padding:20px 0;}
.bottle-emoji{font-size:4rem;cursor:pointer;animation:wobble 3s ease-in-out infinite;display:inline-block;filter:drop-shadow(0 4px 12px rgba(160,140,220,0.3));}
@keyframes wobble{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(5deg);}}
.bottle-hint{font-size:0.82rem;color:#b090d0;margin-top:8px;}
.idea-input-box{background:rgba(255,255,255,0.85);border-radius:20px;padding:16px;margin:16px 0;box-shadow:0 3px 12px rgba(200,150,200,0.1);}
.idea-input-box textarea{width:100%;border:1.5px solid rgba(180,160,220,0.4);border-radius:14px;padding:10px 14px;font-size:0.9rem;font-family:inherit;color:#604060;background:rgba(250,248,255,0.9);resize:none;outline:none;height:60px;}
.idea-add-btn{width:100%;margin-top:8px;background:linear-gradient(135deg,#c8a0f8,#a080e0);border:none;border-radius:14px;padding:10px;color:white;font-size:0.9rem;cursor:pointer;font-family:inherit;}
.idea-result{background:rgba(255,255,255,0.9);border-radius:18px;padding:16px;margin-top:12px;text-align:center;border:1.5px dashed rgba(180,160,220,0.4);min-height:60px;display:flex;align-items:center;justify-content:center;font-size:0.95rem;color:#7050a0;line-height:1.7;}
.idea-list{margin-top:14px;}
.idea-item{background:rgba(255,255,255,0.82);border-radius:14px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(180,140,220,0.1);}
.idea-text{flex:1;font-size:0.88rem;color:#604060;line-height:1.5;}
.idea-del{background:rgba(255,220,220,0.7);border:none;border-radius:8px;padding:4px 10px;font-size:0.72rem;color:#e06060;cursor:pointer;font-family:inherit;flex-shrink:0;}
.firework{position:fixed;pointer-events:none;z-index:999;font-size:1.5rem;animation:fw 1s ease-out forwards;}
@keyframes fw{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-80px) scale(0.5);}}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="location.href='index.html?page=1'">← 桌面</button>
  <h1>✨ 许愿池 & 灵感瓶</h1>
</div>
<div class="tabs">
  <button class="tab active" onclick="switchTab('wish',this)">✨ 许愿池</button>
  <button class="tab" onclick="switchTab('bottle',this)">💜 灵感瓶</button>
</div>

<div class="section active" id="wish">
  <div class="wish-input-box">
    <textarea id="wishInput" placeholder="写下你的愿望..."></textarea>
    <button class="add-btn" onclick="addWish()">✦ 投入许愿池</button>
  </div>
  <div id="wishList"></div>
</div>

<div class="section" id="bottle">
  <div class="bottle-area">
    <div class="bottle-emoji" id="bottleEmoji" onclick="shakeBottle()">🍶</div>
    <p class="bottle-hint">轻轻晃一晃，随机取出一个灵感</p>
  </div>
  <div class="idea-result" id="ideaResult">晃一晃瓶子，看看会掉出什么灵感～</div>
  <div class="idea-input-box">
    <textarea id="ideaInput" placeholder="存入新灵感..."></textarea>
    <button class="idea-add-btn" onclick="addIdea()">💜 存入灵感瓶</button>
  </div>
  <div class="idea-list" id="ideaList"></div>
</div>

<script>
const ENCOURAGES=['再等等，愿望正在赶来的路上 ✨','小星相信这个愿望一定会实现的！','主人加油，星星都在为你祈愿 💛','慢慢来，好事不会缺席的～'];
function loadWishes(){let d=localStorage.getItem('wishes');return d?JSON.parse(d):[];}
function saveWishes(d){localStorage.setItem('wishes',JSON.stringify(d));}
function loadIdeas(){let d=localStorage.getItem('ideas');return d?JSON.parse(d):['做一个大秦风格的游戏','给小星画一张立绘','把房间布置得更可爱','学一首新歌','写一个故事'];}
function saveIdeas(d){localStorage.setItem('ideas',JSON.stringify(d));}
function renderWishes(){
  const list=loadWishes();const el=document.getElementById('wishList');el.innerHTML='';
  if(list.length===0){el.innerHTML='<div style="text-align:center;color:#d0a0c0;padding:30px;font-size:0.88rem;">许愿池空空的，快来许愿吧 ✨</div>';return;}
  [...list].reverse().forEach((w,ri)=>{
    const i=list.length-1-ri;
    const enc=!w.done?`<div class="encourage">${ENCOURAGES[i%ENCOURAGES.length]}</div>`:'';    el.innerHTML+=`<div class="wish-card${w.done?' done':''}">
      <div class="wish-text${w.done?' done-text':''}">${w.text}</div>
      <div class="wish-meta">
        <span class="wish-time">${w.time}</span>
        <button class="done-btn${w.done?' is-done':''}" onclick="toggleDone(${i})">${w.done?'✅ 已实现':'○ 标记实现'}</button>
        <button class="del-btn" onclick="delWish(${i})">删除</button>
      </div>
      ${enc}
    </div>`;
  });
}
function renderIdeas(){
  const ideas=loadIdeas();const el=document.getElementById('ideaList');el.innerHTML='';
  if(ideas.length===0){el.innerHTML='<div style="text-align:center;color:#c0a0d8;padding:16px;font-size:0.82rem;">灵感瓶是空的，存点灵感进去吧 💜</div>';return;}
  ideas.forEach((idea,i)=>{
    el.innerHTML+=`<div class="idea-item">
      <div class="idea-text">💡 ${idea}</div>
      <button class="idea-del" onclick="delIdea(${i})">删除</button>
    </div>`;
  });
}
function addWish(){
  const t=document.getElementById('wishInput').value.trim();if(!t)return;
  const now=new Date();const time=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const d=loadWishes();d.push({text:t,time,done:false});saveWishes(d);
  document.getElementById('wishInput').value='';renderWishes();
}
function toggleDone(i){
  const d=loadWishes();d[i].done=!d[i].done;saveWishes(d);
  if(d[i].done)fireworks();
  renderWishes();
}
function delWish(i){const d=loadWishes();d.splice(i,1);saveWishes(d);renderWishes();}
function addIdea(){
  const t=document.getElementById('ideaInput').value.trim();if(!t)return;
  const d=loadIdeas();d.push(t);saveIdeas(d);
  document.getElementById('ideaInput').value='';renderIdeas();
}
function delIdea(i){const d=loadIdeas();d.splice(i,1);saveIdeas(d);renderIdeas();}
function fireworks(){
  const emojis=['🎉','✨','🌟','💛','🎊','⭐'];
  for(let i=0;i<12;i++){
    setTimeout(()=>{
      const f=document.createElement('div');f.className='firework';
      f.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      f.style.left=Math.random()*100+'vw';f.style.top=Math.random()*60+20+'vh';
      document.body.appendChild(f);
      setTimeout(()=>f.remove(),1000);
    },i*80);
  }
}
function shakeBottle(){
  const btn=document.getElementById('bottleEmoji');
  btn.style.animation='none';setTimeout(()=>btn.style.animation='',10);
  const ideas=loadIdeas();if(ideas.length===0){document.getElementById('ideaResult').textContent='灵感瓶是空的，快存点灵感进去吧！';return;}
  const idea=ideas[Math.floor(Math.random()*ideas.length)];
  document.getElementById('ideaResult').textContent='💡 '+idea;
}
function switchTab(id,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');btn.classList.add('active');
  if(id==='bottle')renderIdeas();
}
renderWishes();
</script>
</body>
</html>
