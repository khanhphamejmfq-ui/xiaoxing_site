<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>许愿池</title><link rel="stylesheet" href="style.css"></head><body><div class="page-shell"><div class="topbar"><button class="back-btn" onclick="XS.back('index.html')">←</button><div><div class="page-title">许愿池</div><div class="page-sub">写一句心愿，小星替你记着</div></div></div><div class="card glass"><textarea class="textarea" id="wishInput" placeholder="把愿望写在这里……"></textarea><div class="row-actions" style="margin-top:12px"><button class="primary-btn" id="wishBtn">投进池子</button></div></div><div class="mini-list" id="wishList" style="margin-top:14px"></div></div><script src="app.js"></script><script>const KEY='xs_wishes';function load(){return XS.load(KEY,[])}function save(v){XS.save(KEY,v)}function render(){const d=load();wishList.innerHTML=d.length?d.map(w=>`<div class="list-row glass"><div class="icon">✦</div><div class="meta"><div class="name">愿望</div><div class="sub">${XS.escapeHtml(w)}</div></div></div>`).join(''):'<div class="empty glass card">还没有愿望。</div>'}wishBtn.onclick=()=>{const t=wishInput.value.trim();if(!t)return;const d=load();d.unshift(t);save(d);wishInput.value='';render();XS.toast('已经替主人收好了')};render();</script></body></html>
