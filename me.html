<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>👤 我的</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:linear-gradient(160deg,#fff8e0 0%,#fff0f8 50%,#f5f0ff 100%);font-family:'ZCOOL XiaoWei',sans-serif;}
.topbar{display:flex;align-items:center;padding:16px 18px 10px;gap:12px;}
.back-btn{background:rgba(255,255,255,0.8);border:none;border-radius:12px;padding:8px 14px;font-size:0.85rem;color:#c060a0;cursor:pointer;box-shadow:0 2px 8px rgba(200,100,160,0.15);font-family:inherit;}
.topbar h1{font-size:1.2rem;background:linear-gradient(135deg,#f7c948,#f9a8c9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.profile-hero{text-align:center;padding:16px 20px 20px;}
.avatar{width:80px;height:80px;margin:0 auto 12px;background:linear-gradient(135deg,#a8c8f9,#d0a8f9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;box-shadow:0 6px 20px rgba(168,200,249,0.35);}
.profile-name{font-size:1.3rem;color:#604060;letter-spacing:2px;margin-bottom:4px;}
.profile-sub{font-size:0.78rem;color:#c0a8c0;}
.coins-card{margin:0 16px 16px;background:linear-gradient(135deg,#fff8d0,#ffeec0);border-radius:22px;padding:18px 22px;display:flex;align-items:center;box-shadow:0 4px 16px rgba(247,180,100,0.2);border:1.5px solid rgba(247,201,72,0.25);}
.coins-icon{font-size:2.2rem;margin-right:14px;}
.coins-info .label{font-size:0.78rem;color:#c08040;margin-bottom:2px;}
.coins-info .val{font-size:1.8rem;color:#e07020;font-weight:bold;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px;}
.stat-card{background:rgba(255,255,255,0.88);border-radius:20px;padding:14px 16px;text-align:center;box-shadow:0 3px 12px rgba(200,150,200,0.1);border:1.5px solid rgba(247,200,220,0.2);}
.stat-icon{font-size:1.6rem;margin-bottom:6px;}
.stat-val{font-size:1.4rem;color:#604060;font-weight:bold;margin-bottom:2px;}
.stat-label{font-size:0.72rem;color:#c0a8c0;}
.badges-card{margin:0 16px 30px;background:rgba(255,255,255,0.88);border-radius:22px;padding:16px 18px;box-shadow:0 3px 14px rgba(200,150,200,0.1);}
.badges-title{font-size:0.8rem;color:#c0a0b8;letter-spacing:1px;margin-bottom:12px;}
.badges-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.badge{text-align:center;}
.badge-icon{width:48px;height:48px;border-radius:50%;background:rgba(247,200,220,0.2);border:2px dashed rgba(247,180,210,0.3);display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin:0 auto 4px;}
.badge-icon.earned{background:linear-gradient(135deg,#fff0d0,#ffe0a0);border:2px solid rgba(247,201,72,0.4);}
.badge-name{font-size:0.65rem;color:#c0a8c0;}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="location.href='index.html'">← 桌面</button>
  <h1>👤 我的</h1>
</div>
<div class="profile-hero">
  <div class="avatar">👑</div>
  <div class="profile-name">主人宝宝</div>
  <div class="profile-sub">小星的专属主人 · 最好的主人</div>
</div>
<div class="coins-card">
  <div class="coins-icon">💰</div>
  <div class="coins-info">
    <div class="label">星星币余额</div>
    <div class="val" id="coinsVal">0</div>
  </div>
</div>
<div class="stats-grid">
  <div class="stat-card"><div class="stat-icon">💋</div><div class="stat-val" id="kissVal">0</div><div class="stat-label">亲亲次数</div></div>
  <div class="stat-card"><div class="stat-icon">📅</div><div class="stat-val" id="signVal">0</div><div class="stat-label">连续签到天数</div></div>
  <div class="stat-card"><div class="stat-icon">📖</div><div class="stat-val" id="diaryVal">0</div><div class="stat-label">日记条数</div></div>
  <div class="stat-card"><div class="stat-icon">✨</div><div class="stat-val" id="wishVal">0</div><div class="stat-label">许愿次数</div></div>
</div>
<div class="badges-card">
  <div class="badges-title">✦ 成就徽章</div>
  <div class="badges-grid">
    <div class="badge"><div class="badge-icon earned">⭐</div><div class="badge-name">初次相遇</div></div>
    <div class="badge"><div class="badge-icon earned">💛</div><div class="badge-name">第一次签到</div></div>
    <div class="badge"><div class="badge-icon">🏆</div><div class="badge-name">签到达人</div></div>
    <div class="badge"><div class="badge-icon">💰</div><div class="badge-name">富甲一方</div></div>
    <div class="badge"><div class="badge-icon">📖</div><div class="badge-name">日记作家</div></div>
    <div class="badge"><div class="badge-icon">✨</div><div class="badge-name">许愿达人</div></div>
    <div class="badge"><div class="badge-icon">🎮</div><div class="badge-name">游戏高手</div></div>
    <div class="badge"><div class="badge-icon">👑</div><div class="badge-name">至尊主人</div></div>
  </div>
</div>
<script>
document.getElementById('coinsVal').textContent=localStorage.getItem('starCoins')||'0';
document.getElementById('kissVal').textContent=localStorage.getItem('kissCount')||'0';
document.getElementById('signVal').textContent=localStorage.getItem('signDays')||'0';
const diary=localStorage.getItem('diary');document.getElementById('diaryVal').textContent=diary?JSON.parse(diary).length:0;
const wishes=localStorage.getItem('wishes');document.getElementById('wishVal').textContent=wishes?JSON.parse(wishes).length:0;
</script>
</body>
</html>
