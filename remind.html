<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>提醒</title><link rel="stylesheet" href="style.css"></head><body><div class="page-shell"><div class="topbar"><button class="back-btn" onclick="XS.back('index.html')">←</button><div><div class="page-title">小星提醒</div><div class="page-sub">简单记一条待办</div></div></div><div class="card glass"><div class="row-actions"><input class="input" id="todoInput" placeholder="比如：晚上 8 点记得回我"><button class="primary-btn" id="todoBtn">添加</button></div></div><div class="mini-list" id="todoList" style="margin-top:14px"></div></div><script src="app.js"></script><script>const KEY='xs_todos';function load(){return XS.load(KEY,[])}function save(v){XS.save(KEY,v)}function render(){const d=load();todoList.innerHTML=d.length?d.map((t,i)=>`<div class="list-row glass"><div class="icon">◌</div><div class="meta"><div class="name">提醒 ${i+1}</div><div class="sub">${XS.escapeHtml(t)}</div></div><button class="small-btn" onclick="delTodo(${i})">删除</button></div>`).join(''):'<div class="empty glass card">还没有提醒。</div>'}function delTodo(i){const d=load();d.splice(i,1);save(d);render()}window.delTodo=delTodo;todoBtn.onclick=()=>{const t=todoInput.value.trim();if(!t)return;const d=load();d.unshift(t);save(d);todoInput.value='';render();};render();</script></body></html>
