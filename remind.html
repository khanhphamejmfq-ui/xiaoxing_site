<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🔔 小星提醒</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:linear-gradient(160deg,#fff5f0 0%,#fff0f8 50%,#f5f0ff 100%);font-family:'ZCOOL XiaoWei',sans-serif;}
.topbar{display:flex;align-items:center;padding:16px 18px 10px;gap:12px;}
.back-btn{background:rgba(255,255,255,0.8);border:none;border-radius:12px;padding:8px 14px;font-size:0.85rem;color:#c060a0;cursor:pointer;box-shadow:0 2px 8px rgba(200,100,160,0.15);font-family:inherit;}
.topbar h1{font-size:1.2rem;background:linear-gradient(135deg,#f7c948,#f9a8c9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.add-box{margin:0 16px 16px;background:rgba(255,255,255,0.88);border-radius:22px;padding:16px 18px;box-shadow:0 3px 14px rgba(200,150,200,0.1);}
.add-box input{width:100%;border:1.5px solid rgba(247,180,210,0.4);border-radius:14px;padding:10px 14px;font-size:0.9rem;font-family:inherit;color:#604060;background:rgba(255,250,253,0.9);outline:none;margin-bottom:8px;}
.add-row{display:flex;gap:8px;}
.add-row input[type=datetime-local]{flex:1;border:1.5px solid rgba(247,180,210,0.4);border-radius:14px;padding:9px 12px;font-size:0.82rem;font-family:inherit;color:#604060;background:rgba(255,250,253,0.9);outline:none;}
.add-btn{background:linear-gradient(135deg,#f7c948,#f9a8c9);border:none;border-radius:14px;padding:9px 18px;color:white;font-size:0.88rem;cursor:pointer;font-family:inherit;flex-shrink:0;}
.list{padding:0 16px 40px;}
.remind-card{background:rgba(255,255,255,0.88);border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:0 3px 12px rgba(200,150,200,0.1);border:1.5px solid rgba(247,200,220,0.25);display:flex;align-items:center;gap:12px;}
.remind-card.done{opacity:0.55;background:rgba(240,255,240,0.7);border-color:rgba(180,220,180,0.3);}
.check-btn{width:28px;height:28px;border-radius:50%;border:2px solid rgba(247,180,210,0.5);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all 0.2s;}
.check-btn.done{background:linear-gradient(135deg,#a0e0a0,#60c060);border-color:transparent;}
.remind-body{flex:1;}
.remind-title{font-size:0.92rem;color:#604060;margin-bottom:3px;}
.remind-title.done{text-decoration:line-through;color:#a0b0a0;}
.remind-time{font-size:0.72rem;color:#c0a8c0;}
.del-btn{background:rgba(255,220,220,0.7);border:none;border-radius:10px;padding:5px 10px;font-size:0.75rem;color:#e06060;cursor:pointer;font-family:inherit;flex-shrink:0;}
.empty{text-align:center;color:#d0a0c0;padding:40px;font-size:0.88rem;}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="location.href='index.html?page=1'">← 桌面</button>
  <h1>🔔 小星提醒</h1>
</div>
<div class="add-box">
  <input id="titleInput" placeholder="提醒标题...">
  <div class="add-row">
    <input type="datetime-local" id="timeInput">
    <button class="add-btn" onclick="addRemind()">+ 添加</button>
  </div>
</div>
<div class="list" id="list"></div>
<script>
function load(){let d=localStorage.getItem('reminds');return d?JSON.parse(d):[];}
function save(d){localStorage.setItem('reminds',JSON.stringify(d));}
function render(){
  const list=load();const el=document.getElementById('list');el.innerHTML='';
  if(list.length===0){el.innerHTML='<div class="empty">还没有提醒，快来添加吧 🔔</div>';return;}
  list.forEach((r,i)=>{
    el.innerHTML+=`<div class="remind-card${r.done?' done':''}">
      <button class="check-btn${r.done?' done':''}" onclick="toggle(${i})">${r.done?'✓':''}</button>
      <div class="remind-body">
        <div class="remind-title${r.done?' done':''}">${r.title}</div>
        <div class="remind-time">${r.time||'未设置时间'}</div>
      </div>
      <button class="del-btn" onclick="del(${i})">删除</button>
    </div>`;
  });
}
function addRemind(){
  const t=document.getElementById('titleInput').value.trim();if(!t)return;
  const tm=document.getElementById('timeInput').value;
  const d=load();
  d.push({title:t,time:tm?tm.replace('T',' '):'',done:false});
  save(d);document.getElementById('titleInput').value='';document.getElementById('timeInput').value='';render();
}
function toggle(i){const d=load();d[i].done=!d[i].done;save(d);render();}
function del(i){const d=load();d.splice(i,1);save(d);render();}
render();
</script>
</body>
</html>
