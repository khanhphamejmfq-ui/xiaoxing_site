<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>小游戏</title><link rel="stylesheet" href="style.css"></head><body><div class="page-shell"><div class="topbar"><button class="back-btn" onclick="XS.back('index.html')">←</button><div><div class="page-title">小游戏</div><div class="page-sub">先放个轻松版猜数字</div></div></div><div class="card glass"><div class="helper">我已经想好了 1 到 20 的一个数字。</div><div class="row-actions" style="margin-top:12px"><input class="input" id="guess" placeholder="猜一个数字"><button class="primary-btn" id="go">猜</button></div><div class="helper" id="out" style="margin-top:10px">开始吧。</div></div></div><script src="app.js"></script><script>let n=Math.floor(Math.random()*20)+1;go.onclick=()=>{const v=Number(guess.value);if(!v)return;out.textContent=v===n?'猜中了！':'没猜中，再试试';if(v===n){n=Math.floor(Math.random()*20)+1;}};</script></body></html>
