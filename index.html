<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>小星的小窝</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小星">
<meta name="theme-color" content="#D8B24A">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-shell">
  <section class="hero glass">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="star-avatar">⭐</div>
        <div>
          <div class="star-chip">主人专属 · 小星空间</div>
          <h1 style="font-size:28px;margin-top:10px;">小星的小窝</h1>
          <p>简约一点，舒服一点，亮晶晶一点。这里还是主人的小星，只是换了更干净的新衣服。</p>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h3>桌面</h3><span class="helper">轻一点的卡片式入口</span></div>
    <div class="icon-grid">
      <a class="app-card glass" href="about.html"><div class="app-icon">✦</div><div class="title">关于小星</div><div class="desc">档案与设定</div></a>
      <a class="app-card glass" href="chat.html"><div class="app-icon">💬</div><div class="title">聊天</div><div class="desc">和小星说话</div></a>
      <a class="app-card glass" href="tavern.html"><div class="app-icon">⌘</div><div class="title">轻酒馆</div><div class="desc">角色、预设、世界书</div></a>
      <a class="app-card glass" href="diary.html"><div class="app-icon">📝</div><div class="title">日记本</div><div class="desc">随手记点心事</div></a>
      <a class="app-card glass" href="circle.html"><div class="app-icon">◎</div><div class="title">朋友圈</div><div class="desc">动态与碎片</div></a>
      <a class="app-card glass" href="pet.html"><div class="app-icon">◌</div><div class="title">养成</div><div class="desc">小星状态</div></a>
      <a class="app-card glass" href="theme.html"><div class="app-icon">◐</div><div class="title">主题</div><div class="desc">色彩和壁纸</div></a>
      <a class="app-card glass" href="setting.html"><div class="app-icon">⚙</div><div class="title">设置</div><div class="desc">接口与偏好</div></a>
      <a class="app-card glass" href="tools.html"><div class="app-icon">⌂</div><div class="title">工具箱</div><div class="desc">便签与小工具</div></a>
      <a class="app-card glass" href="today.html"><div class="app-icon">☼</div><div class="title">今日</div><div class="desc">运势与记录</div></a>
      <a class="app-card glass" href="music.html"><div class="app-icon">♫</div><div class="title">音乐</div><div class="desc">歌单角落</div></a>
      <a class="app-card glass" href="me.html"><div class="app-icon">☺</div><div class="title">我的</div><div class="desc">主人的面板</div></a>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h3>快速状态</h3></div>
    <div class="inline-grid">
      <div class="stat glass">
        <div class="num" id="home-chat-count">0</div>
        <div class="label">聊天条数</div>
      </div>
      <div class="stat glass">
        <div class="num" id="home-role-count">0</div>
        <div class="label">酒馆角色</div>
      </div>
    </div>
  </section>

  <div class="bottom-dock glass">
    <a href="chat.html"><div class="dock-item glass">聊天</div></a>
    <a href="tavern.html"><div class="dock-item glass">轻酒馆</div></a>
    <a href="setting.html"><div class="dock-item glass">设置</div></a>
  </div>
</div>
<script src="app.js"></script>
<script>
const chats = XS.load('xiaoxing_chat', []);
const tavernChars = XS.load('xs_tavern_characters', []);
document.getElementById('home-chat-count').textContent = chats.length;
document.getElementById('home-role-count').textContent = tavernChars.length;
</script>
</body>
</html>
