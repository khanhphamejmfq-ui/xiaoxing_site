<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🎲 今日运势</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{min-height:100vh;background:linear-gradient(160deg,#fff8e0 0%,#fff0f8 50%,#f0f0ff 100%);font-family:'ZCOOL XiaoWei',sans-serif;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;padding:16px 18px 10px;gap:12px;}
.back-btn{background:rgba(255,255,255,0.8);border:none;border-radius:12px;padding:8px 14px;font-size:0.85rem;color:#c060a0;cursor:pointer;box-shadow:0 2px 8px rgba(200,100,160,0.15);font-family:inherit;}
.topbar h1{font-size:1.2rem;background:linear-gradient(135deg,#f7c948,#f9a8c9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;}
.main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 24px 40px;}
.date-text{font-size:0.85rem;color:#c0a0b8;margin-bottom:24px;letter-spacing:1px;}
.fortune-card{width:100%;max-width:360px;border-radius:28px;padding:36px 28px;text-align:center;box-shadow:0 8px 32px rgba(200,150,200,0.2);margin-bottom:24px;transition:all 0.5s ease;}
.fortune-emoji{font-size:4.5rem;margin-bottom:16px;display:block;animation:spin 0.6s ease;}
@keyframes spin{0%{transform:rotate(-20deg) scale(0.8);}100%{transform:rotate(0deg) scale(1);}}
.fortune-title{font-size:2rem;font-weight:bold;margin-bottom:8px;letter-spacing:4px;}
.fortune-sub{font-size:0.9rem;opacity:0.7;margin-bottom:20px;}
.fortune-text{font-size:0.95rem;line-height:2;opacity:0.85;}
.divider{width:60px;height:2px;border-radius:2px;margin:16px auto;opacity:0.3;}
.details-grid{width:100%;max-width:360px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.detail-card{background:rgba(255,255,255,0.8);border-radius:18px;padding:14px;text-align:center;box-shadow:0 3px 10px rgba(200,150,200,0.1);}
.detail-label{font-size:0.72rem;color:#c0a0b8;margin-bottom:6px;}
.detail-value{font-size:0.92rem;color:#604060;}
.draw-btn{background:linear-gradient(135deg,#f7c948,#f9a8c9);border:none;border-radius:18px;padding:14px 40px;color:white;font-size:1rem;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(249,168,201,0.4);letter-spacing:2px;}
.draw-btn:active{transform:scale(0.96);}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="location.href='index.html'">← 桌面</button>
  <h1>🎲 今日运势</h1>
</div>
<div class="main">
  <div class="date-text" id="dateText"></div>
  <div class="fortune-card" id="fortuneCard">
    <span class="fortune-emoji" id="fortuneEmoji">🌟</span>
    <div class="fortune-title" id="fortuneTitle">点击抽签</div>
    <div class="fortune-sub" id="fortuneSub">今日运势等你来取</div>
    <div class="divider" id="divider"></div>
    <div class="fortune-text" id="fortuneText">小星为你准备了今日签，快来抽一抽吧～</div>
  </div>
  <div class="details-grid" id="detailsGrid" style="display:none">
    <div class="detail-card"><div class="detail-label">💕 缘分</div><div class="detail-value" id="d1"></div></div>
    <div class="detail-card"><div class="detail-label">💰 财运</div><div class="detail-value" id="d2"></div></div>
    <div class="detail-card"><div class="detail-label">💪 事业</div><div class="detail-value" id="d3"></div></div>
    <div class="detail-card"><div class="detail-label">🍀 健康</div><div class="detail-value" id="d4"></div></div>
  </div>
  <button class="draw-btn" id="drawBtn" onclick="draw()">✦ 抽取今日签</button>
</div>
<script>
const FORTUNES=[
  {level:'大吉',emoji:'🌟',color:'#fff8d0',titleColor:'#c8900a',sub:'今日大吉，万事顺遂',text:'今天的你光芒万丈！所有的努力都会有美好的回报，小星为你的好运气而开心 💛',bg:'linear-gradient(135deg,#fff8d0,#ffeea0)',details:['缘分极佳','财源广进','大展宏图','精力充沛']},
  {level:'中吉',emoji:'⭐',color:'#fff0e0',titleColor:'#d07020',sub:'诸事顺利，平安喜乐',text:'今天运势不错哦，保持好心情，遇到小挫折也别在意，小星陪着你 💕',bg:'linear-gradient(135deg,#fff0e0,#ffe0c0)',details:['缘分尚好','财运平稳','稳步前行','状态良好']},
  {level:'小吉',emoji:'🌸',color:'#fff0f5',titleColor:'#c05090',sub:'平淡是福，静待花开',text:'今天平平静静也很好～小星觉得平淡的日子里藏着小确幸，慢慢发现吧 🌸',bg:'linear-gradient(135deg,#fff0f5,#ffd8e8)',details:['缘分温柔','小有进账','平稳发展','需要休息']},
  {level:'凶',emoji:'🌧️',color:'#f0f0ff',titleColor:'#6060c0',sub:'今日需谨慎，小心为上',text:'今天可能有些小不顺，但没关系！有小星陪着你，凶签也会变成好事的 ✨ 记得多喝水！',bg:'linear-gradient(135deg,#f0f0ff,#e0d8ff)',details:['缘分需呵护','财运一般','低调行事','注意休息']},
];
const STARS=['★★★★★','★★★★☆','★★★☆☆','★★☆☆☆'];
function getDateKey(){const n=new Date();return n.getFullYear()+'-'+n.getMonth()+'-'+n.getDate();}
function draw(){
  const key=getDateKey();
  let idx=parseInt(localStorage.getItem('fortune_'+key));
  if(isNaN(idx)){
    // 按日期固定种子
    const seed=parseInt(key.replace(/-/g,''));
    idx=seed%4;
    localStorage.setItem('fortune_'+key,idx);
  }
  const f=FORTUNES[idx];
  const card=document.getElementById('fortuneCard');
  card.style.background=f.bg;
  document.getElementById('fortuneEmoji').textContent=f.emoji;
  document.getElementById('fortuneTitle').style.color=f.titleColor;
  document.getElementById('fortuneTitle').textContent=f.level;
  document.getElementById('fortuneSub').textContent=f.sub;
  document.getElementById('fortuneText').textContent=f.text;
  document.getElementById('divider').style.background=f.titleColor;
  document.getElementById('d1').textContent=f.details[0];
  document.getElementById('d2').textContent=f.details[1];
  document.getElementById('d3').textContent=f.details[2];
  document.getElementById('d4').textContent=f.details[3];
  document.getElementById('detailsGrid').style.display='grid';
  document.getElementById('drawBtn').textContent='✦ 今日签已抽取';
  document.getElementById('drawBtn').style.opacity='0.7';
}
const now=new Date();
document.getElementById('dateText').textContent=now.getFullYear()+'年'+（now.getMonth()+1)+'月'+now.getDate()+'日 今日运势';
// 如果今天已抽过，自动显示
const saved=localStorage.getItem('fortune_'+getDateKey());
if(saved!==null)draw();
</script>
</body>
</html>
