<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>聊天</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-shell chat-shell">
  <div class="topbar">
    <button class="back-btn" onclick="XS.back('index.html')">←</button>
    <div><div class="page-title">小星聊天</div><div class="page-sub" id="statusText">干净一点的聊天界面</div></div>
  </div>
  <div class="chat-list" id="chatArea"><div class="empty glass card" id="emptyHint">和小星说点什么吧。<br>如果已经在设置里配好 API，这里就会直接开始聊。</div></div>
  <div class="chat-input-bar">
    <textarea class="textarea" id="inputBox" placeholder="说点什么……" style="min-height:56px"></textarea>
    <div style="display:flex;flex-direction:column;gap:10px;width:96px">
      <button class="primary-btn" id="sendBtn" onclick="sendMsg()">发送</button>
      <button class="secondary-btn" onclick="location.href='setting.html'">设置</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script src="chat.js"></script>
</body>
</html>
