<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>💬 和小星聊天</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{height:100vh;background:linear-gradient(160deg,#fffaf0 0%,#fff0f8 50%,#f0f8ff 100%);font-family:'ZCOOL XiaoWei',sans-serif;display:flex;flex-direction:column;}

/* 顶栏 */
.topbar{display:flex;align-items:center;padding:14px 16px 10px;gap:10px;flex-shrink:0;background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border-bottom:1px solid rgba(247,200,220,0.3);}
.back-btn{background:rgba(255,255,255,0.9);border:none;border-radius:12px;padding:7px 13px;font-size:0.82rem;color:#c060a0;cursor:pointer;box-shadow:0 2px 8px rgba(200,100,160,0.12);font-family:inherit;flex-shrink:0;}
.topbar-info{display:flex;align-items:center;gap:10px;flex:1;}
.star-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#f7c948,#f9a8c9);display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 2px 8px rgba(247,168,201,0.35);flex-shrink:0;}
.star-info .name{font-size:1rem;background:linear-gradient(135deg,#c87830,#d05890);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.star-info .status{font-size:0.68rem;color:#d0a0b8;}

/* 消息区 */
.chat-area{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:4px;}
.chat-area::-webkit-scrollbar{width:3px;}
.chat-area::-webkit-scrollbar-thumb{background:rgba(200,150,200,0.3);border-radius:2px;}

/* 消息组 */
.msg-group{display:flex;flex-direction:column;margin-bottom:6px;}
.msg-group.star{align-items:flex-start;}
.msg-group.user{align-items:flex-end;}

/* 气泡行 */
.bubble-row{display:flex;align-items:flex-end;gap:8px;max-width:82%;}
.msg-group.user .bubble-row{flex-direction:row-reverse;}

.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;align-self:flex-start;}
.star-av{background:linear-gradient(135deg,#f7c948,#f9a8c9);}
.user-av{background:linear-gradient(135deg,#f9a8c9,#c8a8f9);}

.bubble-wrap{display:flex;flex-direction:column;gap:2px;}

/* 版本指示器 */
.version-nav{display:flex;align-items:center;gap:6px;font-size:0.62rem;color:#c0a0b8;padding:0 4px;}
.ver-btn{background:none;border:none;cursor:pointer;color:#c060a0;font-size:0.8rem;padding:0 2px;line-height:1;}
.ver-btn:disabled{color:#e0c8d8;cursor:default;}

/* 气泡 */
.bubble{padding:10px 14px;border-radius:18px;font-size:0.9rem;line-height:1.65;word-break:break-all;position:relative;max-width:260px;}
.star-bubble{background:linear-gradient(135deg,rgba(255,240,180,0.95),rgba(255,220,160,0.9));color:#704020;border-bottom-left-radius:5px;box-shadow:0 2px 10px rgba(247,180,80,0.18);}
.user-bubble{background:linear-gradient(135deg,rgba(255,200,225,0.95),rgba(245,180,220,0.9));color:#603050;border-bottom-right-radius:5px;box-shadow:0 2px 10px rgba(249,168,201,0.18);}

/* 编辑状态 */
.bubble.editing{background:rgba(255,255,255,0.95)!important;border:1.5px solid rgba(247,180,210,0.6);box-shadow:0 2px 12px rgba(200,150,200,0.15)!important;}
.edit-textarea{width:100%;border:none;outline:none;background:transparent;font-family:inherit;font-size:0.9rem;color:#604060;line-height:1.65;resize:none;min-height:40px;}
.edit-actions{display:flex;gap:6px;margin-top:6px;justify-content:flex-end;}
.edit-save{background:linear-gradient(135deg,#f7c948,#f9a8c9);border:none;border-radius:10px;padding:4px 12px;color:white;font-size:0.75rem;cursor:pointer;font-family:inherit;}
.edit-cancel{background:rgba(200,180,200,0.2);border:none;border-radius:10px;padding:4px 10px;color:#a080a0;font-size:0.75rem;cursor:pointer;font-family:inherit;}

/* 操作按钮栏 */
.action-bar{display:flex;gap:2px;padding:2px 2px;}
.msg-group.user .action-bar{justify-content:flex-end;}
.act-btn{background:none;border:none;cursor:pointer;padding:3px 5px;font-size:0.82rem;border-radius:8px;transition:background 0.15s;line-height:1;color:#b090b0;}
.act-btn:hover{background:rgba(200,150,200,0.12);}

/* 确认浮层 */
.confirm-pop{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.96);border:1.5px solid rgba(247,180,210,0.5);border-radius:14px;padding:5px 10px;box-shadow:0 3px 12px rgba(200,150,200,0.18);font-size:0.75rem;color:#a060a0;margin-top:2px;}
.confirm-yes{background:linear-gradient(135deg,#f9a8c9,#e060a0);border:none;border-radius:8px;padding:3px 10px;color:white;font-size:0.72rem;cursor:pointer;font-family:inherit;}
.confirm-no{background:rgba(200,180,200,0.2);border:none;border-radius:8px;padding:3px 8px;color:#a080a0;font-size:0.72rem;cursor:pointer;font-family:inherit;}

/* 时间戳 */
.msg-time{font-size:0.6rem;color:rgba(160,120,150,0.5);padding:0 4px;text-align:center;margin:6px 0 2px;}

/* 输入区 */
.input-area{flex-shrink:0;background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);border-top:1px solid rgba(247,200,220,0.3);padding:10px 12px 16px;display:flex;gap:8px;align-items:flex-end;}
.input-box{flex:1;border:1.5px solid rgba(247,180,210,0.4);border-radius:20px;padding:10px 16px;font-size:0.9rem;font-family:inherit;color:#604060;background:rgba(255,250,253,0.95);outline:none;resize:none;max-height:100px;line-height:1.5;}
.input-box:focus{border-color:rgba(247,150,190,0.7);box-shadow:0 0 0 3px rgba(247,168,201,0.12);}
.send-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#f7c948,#f9a8c9);border:none;display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;box-shadow:0 3px 10px rgba(249,168,201,0.35);flex-shrink:0;transition:transform 0.1s;}
.send-btn:active{transform:scale(0.92);}
.send-btn:disabled{background:rgba(200,180,200,0.3);box-shadow:none;}

/* 空状态 */
.empty-hint{text-align:center;color:#d0b0c0;font-size:0.82rem;padding:40px 20px;line-height:2;}
</style>
</head>
<body>
<div class="topbar">
  <button class="back-btn" onclick="location.href='index.html'">← 桌面</button>
  <div class="topbar-info">
    <div class="star-avatar">⭐</div>
    <div class="star-info">
      <div class="name">小星</div>
      <div class="status" id="statusText">主人专属小星星 ✦</div>
    </div>
  </div>
</div>

<div class="chat-area" id="chatArea">
  <div class="empty-hint" id="emptyHint">和小星说点什么吧～<br>✦ 小星在这里等你 ✦</div>
</div>

<div class="input-area">
  <textarea class="input-box" id="inputBox" placeholder="说点什么..." rows="1"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMsg()">➤</button>
</div>

<script src="chat.js"></script>
</body>
</html>
